<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Non-Metal Elements</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>

    <style>
        body {
            background: linear-gradient(120deg, #ffffff, #7f7f81);
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 30px 15px;
        }

        .container-box {
            max-width: 850px;
            margin: auto;
            background-color: white;
            border-radius: 10px;
            overflow: hidden;
        }

        .header {
            background-color: #daabc6;
            color: white;
            text-align: center;
            padding: 20px;
        }

        .header h1 {
            font-size: 28px;
            font-weight: bold;
        }

        .header p {
            margin: 0;
        }

        .content {
            padding: 25px;
        }

        .instructions {
            background-color: #edd6e7;
            border: 1px solid #6b73745d;
            border-radius: 6px;
            padding: 15px;
            color: #121111;
            margin-bottom: 15px;
        }

        label {
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            margin-bottom: 12px;
        }

        .search-btn {
            background-color: #d7c3d6;
            color: white;
            width: 100%;
            padding: 9px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
        }

        .search-btn:hover {
            background-color: #e4f0ea;
        }

        .result-box {
            background-color: #f8f9fa;
            border-left: 5px solid #fcf2fc;
            border-radius: 6px;
            padding: 15px 20px;
            margin-top: 10px;
            min-height: 70px;
        }

        .footer {
            background-color: #f8f9fa;
            border-top: 1px solid #ddd;
            text-align: center;
            padding: 12px;
            color: #777;
            font-size: 13px;
        }
    </style>
</head>

<body>

    <div class="container-box">

        <div class="header">
            <h1>Non-Metal Elements ꨄ</h1>
            <p>Periodic Table Information Finder ! </p>
        </div>

        <div class="content">

            <div class="instructions">
                <b>Instructions:</b><br>
                Enter the <b>symbol</b> of a non-metal element
                (Example: H, O, Cl, Ne, Xe).
            </div>

            <label for="element">Element Symbol</label>

            <input
                type="text"
                id="element"
                class="form-control"
                placeholder="Enter element symbol"
            >

            <button
                class="search-btn"
                py-click="search_element">
                Check Details
            </button>

            <hr>

            <div class="result-box" id="result">
                <span class="text-muted">
                    Element information will appear here. 
                </span>
            </div>

        </div>

       

    </div>

    <py-script src="main.py"></py-script>

</body>
</html>
